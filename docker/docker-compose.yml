version: '3.8'

services:
  casual-games-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: casual-games-platform
    restart: unless-stopped
    ports:
      - "8080:80"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
