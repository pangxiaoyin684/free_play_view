name: Build, Verify and Release to GitHub & Aliyun ACR

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  ACR_REGISTRY: crpi-vrso5s2zv7dk1hk1.cn-wulanchabu.personal.cr.aliyuncs.com
  IMAGE_REPOSITORY: crpi-vrso5s2zv7dk1hk1.cn-wulanchabu.personal.cr.aliyuncs.com/pangxiaoyin/free-play-view

jobs:
  # =========================================================================
  # 任务 1：多端全量编译、产物合规检验与 Release 归档包生成
  # =========================================================================
  build-and-verify:
    name: 🚀 Build, Verify & Package Multi-App
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码仓库
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 安装与配置 Node.js 20 编译环境
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # 3. 安装项目全量依赖
      - name: Install Dependencies
        run: npm ci

      # 4. 构建 PC Web 管理后台 (Vite + Vue 3)
      - name: Build PC Web Admin
        run: npm run build:admin

      # 5. 构建 H5 移动前台 (UniApp + Vue 3)
      - name: Build Mobile H5 Client
        run: npm run build:h5

      # 6. 构建 微信小程序端
      - name: Build WeChat Mini-Program
        run: npm run build:mp-weixin

      # 7. 运行自动化构建物与安全合规性校验
      - name: Run Build Verification
        run: node scripts/verify_build.js

      # 8. 聚合前端静态资源 (根路径为 H5 移动前台，/admin/ 路径为 PC 运营管理后台)
      - name: Prepare Aggregated Distribution Site
        run: |
          mkdir -p dist-public
          cp -r dist/build/h5/* dist-public/
          mkdir -p dist-public/admin
          cp -r dist-admin/* dist-public/admin/

      # 9. 压缩并打包分发 Zip 归档文件
      - name: Package Distribution Zips
        run: |
          mkdir -p release-packages
          # 移动端 H5 压缩包
          cd dist/build/h5 && zip -r ../../../release-packages/casual-games-h5.zip ./* && cd ../../..
          # PC Web 管理后台压缩包
          cd dist-admin && zip -r ../release-packages/casual-games-admin.zip ./* && cd ..
          # 微信小程序端压缩包
          cd dist/build/mp-weixin && zip -r ../../../release-packages/casual-games-mp-weixin.zip ./* && cd ../../..
          # 双端聚合全量网站包
          cd dist-public && zip -r ../release-packages/casual-games-all-in-one.zip ./* && cd ..

      # 10. 上传多端构建物至 GitHub Artifacts (可永久保存并一键下载)
      - name: Upload Multi-Platform Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: casual-games-release-packages
          path: release-packages/
          retention-days: 30

  # =========================================================================
  # 任务 2：构建 Docker 镜像并推送至阿里云 ACR (对齐 idc_console / pangxiaoyin_view)
  # =========================================================================
  push-to-aliyun-acr:
    name: 🐳 Build & Push Docker Image to Aliyun ACR
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Aliyun ACR
        if: env.ACR_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.run_number }}
            ${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
